name: Cleanup Old Artifacts

on:
  # Run daily at 00:00 UTC
  schedule:
    - cron: '0 0 * * *'
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      keep_count:
        description: 'Number of most recent artifacts to keep (repository-wide)'
        required: false
        default: '2'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Cleanup old artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const keepCount = parseInt('${{ github.event.inputs.keep_count || 2 }}');

            console.log(`Keeping the ${keepCount} most recent artifacts repository-wide...`);

            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            console.log(`Found ${artifacts.length} total artifacts`);

            // Les artefacts déjà expirés n'occupent plus de stockage mais
            // polluent la liste : on les supprime dans tous les cas.
            const expired = artifacts.filter((a) => a.expired);

            const live = artifacts
              .filter((a) => !a.expired)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            const artifactsToDelete = [...expired, ...live.slice(keepCount)];

            const keptBytes = live
              .slice(0, keepCount)
              .reduce((sum, a) => sum + a.size_in_bytes, 0);
            const freedBytes = live
              .slice(keepCount)
              .reduce((sum, a) => sum + a.size_in_bytes, 0);

            console.log(`Live artifacts: ${live.length}, expired: ${expired.length}`);
            console.log(`Will delete ${artifactsToDelete.length} artifacts`);
            console.log(`Freeing ~${(freedBytes / 1048576).toFixed(1)} MB, keeping ~${(keptBytes / 1048576).toFixed(1)} MB`);

            let deletedCount = 0;
            for (const artifact of artifactsToDelete) {
              try {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id
                });
                console.log(`✓ Deleted: ${artifact.name} (ID: ${artifact.id}, created: ${artifact.created_at})`);
                deletedCount++;
              } catch (error) {
                console.error(`✗ Failed to delete artifact ${artifact.id}: ${error.message}`);
              }
            }

            console.log(`\nCleanup complete! Deleted ${deletedCount} of ${artifactsToDelete.length} artifacts.`);
