name: Build Android APK

# APK is built only for `main` (no PR / feature-branch builds).
# `workflow_dispatch` allows a manual on-demand run.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build:skip-types

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      # Publish a "nightly" prerelease so the APK is downloadable straight to a
      # phone. Only on the real main branch (skipped for manual runs elsewhere).
      # Une prerelease par commit, pour garder un historique des builds de main.
      - name: Publish nightly prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source .github/scripts/nightly-tag.sh

          gh release create "$NIGHTLY_TAG" \
            --title "Nightly $NIGHTLY_DATE ($NIGHTLY_SHA7)" \
            --notes "Build automatique de \`main\` — commit ${{ github.sha }}" \
            --prerelease \
            --target "${{ github.sha }}" \
            android/app/build/outputs/apk/debug/app-debug.apk

      - name: Prune old nightly releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: '3'
        run: .github/scripts/prune-nightlies.sh
