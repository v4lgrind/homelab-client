name: Build Android APK

# APK is built only for `main` (no PR / feature-branch builds).
# `workflow_dispatch` allows a manual on-demand run.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build:skip-types

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: homelab-client-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # Publish a "nightly" prerelease so the APK is downloadable straight to a
      # phone. Only on the real main branch (skipped for manual runs elsewhere).
      - name: Publish nightly prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly \
            --title "Nightly Build" \
            --notes "Build automatique du commit ${{ github.sha }} — $(date -u +'%Y-%m-%d %H:%M UTC')" \
            --prerelease \
            android/app/build/outputs/apk/debug/app-debug.apk
