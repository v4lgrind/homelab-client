name: Release

# Manual, versioned release: you give a version number, this builds the APK,
# tags the commit, and publishes a GitHub release with the APK attached.
#
# The APK is a release build signed with the release key, rotated from the
# legacy committed keystore so it installs over older builds and keeps their
# data (see scripts/sign-android-apk.sh). versionCode comes from
# .github/scripts/android-version.sh; the app's in-app updater
# (src/services/app-update.ts) reads the same scheme from the tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version semver, ex. 1.0.0 (sans le préfixe v)"
        required: true
        type: string
      prerelease:
        description: "Marquer comme prerelease"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate version + compute versionCode
        id: ver
        run: |
          V="${{ inputs.version }}"
          V="${V#v}"                       # tolerate a leading "v"
          # Validates MAJOR.MINOR.PATCH (MINOR, PATCH <= 99) and exports
          # ANDROID_VERSION_CODE / ANDROID_VERSION_NAME, read by build.gradle.
          .github/scripts/android-version.sh release "$V" | tee -a "$GITHUB_ENV"
          echo "version=$V"       >> "$GITHUB_OUTPUT"
          echo "tag=v$V"          >> "$GITHUB_OUTPUT"

      - name: Fail if tag already exists
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::La release ${{ steps.ver.outputs.tag }} existe déjà."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build:skip-types

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign APK with the release key
        env:
          KEYSTORE_B64: ${{ secrets.HOMELAB_SIGNING_KEYSTORE_B64 }}
          HOMELAB_SIGNING_PASSWORD: ${{ secrets.HOMELAB_SIGNING_PASSWORD }}
        run: |
          export HOMELAB_SIGNING_KEYSTORE="$RUNNER_TEMP/homelab-release.p12"
          echo "$KEYSTORE_B64" | base64 -d > "$HOMELAB_SIGNING_KEYSTORE"
          scripts/sign-android-apk.sh --require android/app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
             "homelab-${{ steps.ver.outputs.tag }}.apk"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            --target "${{ github.sha }}" \
            --title "Homelab ${{ steps.ver.outputs.tag }}" \
            --generate-notes \
            ${{ inputs.prerelease && '--prerelease' || '' }} \
            "homelab-${{ steps.ver.outputs.tag }}.apk"
