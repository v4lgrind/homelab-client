name: Release

# Manual, versioned release: you give a version number, this builds the APK,
# tags the commit, and publishes a GitHub release with the APK attached.
#
# The APK is debug-signed with the committed fixed keystore (same signature as
# the nightly build), so it installs over an existing install without an
# uninstall. versionCode is derived from semver so upgrades are monotonic.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version semver, ex. 1.0.0 (sans le préfixe v)"
        required: true
        type: string
      prerelease:
        description: "Marquer comme prerelease"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate version + compute versionCode
        id: ver
        run: |
          V="${{ inputs.version }}"
          V="${V#v}"                       # tolerate a leading "v"
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version invalide '$V' — attendu MAJOR.MINOR.PATCH (ex. 1.0.0)"
            exit 1
          fi
          IFS=. read -r MA MI PA <<< "$V"
          CODE=$(( MA * 10000 + MI * 100 + PA ))
          echo "version=$V"       >> "$GITHUB_OUTPUT"
          echo "code=$CODE"       >> "$GITHUB_OUTPUT"
          echo "tag=v$V"          >> "$GITHUB_OUTPUT"

      - name: Fail if tag already exists
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::La release ${{ steps.ver.outputs.tag }} existe déjà."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Apply version to build.gradle
        run: |
          sed -i "s/versionCode [0-9]\+/versionCode ${{ steps.ver.outputs.code }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ steps.ver.outputs.version }}\"/" android/app/build.gradle
          grep -nE "versionCode|versionName" android/app/build.gradle

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build:skip-types

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "homelab-${{ steps.ver.outputs.tag }}.apk"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            --target "${{ github.sha }}" \
            --title "Homelab ${{ steps.ver.outputs.tag }}" \
            --generate-notes \
            ${{ inputs.prerelease && '--prerelease' || '' }} \
            "homelab-${{ steps.ver.outputs.tag }}.apk"
